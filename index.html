<!DOCTYPE html>
<html>
  <head>
    <link href="style.css" rel="stylesheet">
  </head>
  <body>
    <center>
      <div id="big-box">
	<center>
	  <div id="title-box">
	    <h1>34'dle</h1>
	    <i>danbooru ver.</i>
	  </div>
	</center>
	<div id="game-box">
	  <div id="left-box" class="box"><center>
	    <p id="limg-label"></p>
	    <img id="left-image" class="img" alt="press 'start' to begin!"></img>
	    <p id="limg-post-id"></p>
	  </center></div>
	  <div id="middle-box" class="box">
	    <p id="current-score">Current score: </p>
	    <p id="hi-score">Hi-score: </p>
	    <button id="top-button" class="button" type="button" disabled>Higher!</button>
	    <button id="start-button" class="button" type="button">start</button>
	    <button id="bottom-button" class="button" type="button" disabled>Not higher!</button>
	  </div>
	  <div id="right-box" class="box"><center>
	    <p id="rimg-label"></p>
	    <img id="right-image" class="img" alt="press 'start' to begin!"></img>
	    <p id="rimg-post-id"></p>
	  </center></div>
	</div>
      </div>
    </center>
    <script src="game.js"></script>
  </body>
</html>
